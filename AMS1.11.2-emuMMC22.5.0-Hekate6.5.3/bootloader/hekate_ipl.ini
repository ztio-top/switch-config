#效果：开机等待 3 秒后**直接自动进虚拟系统**，小孩几乎碰不到 Hekate 菜单。
#如果你自己后续要进 Hekate 菜单：开机按住音量减键，就能跳过自动启动，调出 Hekate。
#自动启动 也就是 EMUNAND 虚拟系统
[config]
autoboot=1
autoboot_list=0
bootwait=3
backlight=100
noticker=0
autohosoff=1
autonogc=1
# 大气层里点「重启到 payload」→ 直接启动 fusee（大气层原生 payload），**跳过 Hekate，直接进 CFW**
updater2p=0
bootprotect=0


#【注释隐藏：破解真实系统SYSNAND，防止误启动】
#[CFW (SYSNAND)]
#emummc_force_disable=1
#fss0=atmosphere/package3
#atmosphere=1
#logopath=bootloader/bootlogo.bmp
#icon=bootloader/res/sysnand.bmp
#id=1

#下面是虚拟系统启动项，usb3force=1开启USB3，会影响蓝牙2.4G
[CFW (EMUNAND)]
emummcforce=1
fss0=atmosphere/package3
atmosphere=1
logopath=bootloader/bootlogo.bmp
icon=bootloader/res/emunand.bmp
id=2
usb3force=1

#【注释隐藏：原版真实系统OFW，严禁误进联网】
#[OFW (SYSNAND)]
#emummc_force_disable=1
#fss0=atmosphere/package3
#stock=1
#icon=bootloader/res/icon_switch.bmp
#id=3
